[project]
name = "trustdesk"
version = "0.1.0"
description = "Compliance workspace: employee requests pre-validated by AI against company policies, on Postgres + pgvector, with a REST API and an MCP server."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "agentpg-kit>=0.3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "mcp>=2.3",
  "pypdf>=5.0",
  "cryptography>=43",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trustdesk = "trustdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres with pgvector (DATABASE_URL)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# The shared kit comes from the same release the Dockerfile installs (tag v0.3.1), so a plain `uv pip install -e ".[dev]"` works
# without any sibling checkout. To work on the kit at the same time, install your checkout over it afterwards:
#   uv pip install -e ../agentpg-kit     (or: make kit-local)
# When you raise the minimum in `dependencies`, raise this tag and the KIT_URL in the Dockerfile together.
[tool.uv.sources]
agentpg-kit = { git = "https://github.com/elchinoo/agentpg-kit", tag = "v0.3.1" }
